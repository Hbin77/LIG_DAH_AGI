name: DAH Agent Quality Gate

on:
  push:
    branches:
      - hbin
  workflow_dispatch:

jobs:
  agent-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: hbin
          fetch-depth: 0

      - name: Ensure hbin branch context
        run: git checkout hbin

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile source and tests
        run: python -m compileall -q src scripts tests

      - name: Run agent regression tests
        run: python -m unittest discover -s tests

      - name: Rebuild package and verify state
        run: |
          python scripts/build_submission_package.py
          python scripts/generate_release_handoff.py
          python scripts/verify_submission_state.py
