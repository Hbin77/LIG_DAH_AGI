name: DEV Submission Quality Gate

on:
  push:
    branches:
      - DEV
  pull_request:
    branches:
      - DEV

jobs:
  dev-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Ensure DEV branch context
        run: |
          test "${GITHUB_REF_NAME}" = "DEV" || test "${GITHUB_BASE_REF}" = "DEV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify DEV submission state
        run: |
          python scripts/verify_submission_state.py --require-dev --require-clean
